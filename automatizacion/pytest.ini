[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    tc(id): ID del caso de prueba que implementa la prueba (TC-XXX)
    smoke: pruebas rápidas de humo
    regression: suite de regresión
    auth: autenticación, MFA y sesión
    roles: control de acceso por rol (UI y API)
    pacientes: registro, búsqueda y edición de pacientes
    historia_clinica: embarazo, controles prenatales, notas y antecedentes
    citas: agenda de citas y triaje
    laboratorio: resultados e importación de laboratorio
    ecografia_ia: ecografías y análisis con redes neuronales
    reportes: reportes, exportación y auditoría
    calculadoras: calculadoras clínicas
    api: pruebas de la API
    ui: pruebas de interfaz con Selenium WebDriver
    e2e: flujos completos de punta a punta
    busqueda: buscadores y filtros de los listados
    ide: grabaciones de Selenium IDE reproducidas con selenium-side-runner
    rendimiento: pruebas de carga con Locust
    configuracion: tareas de preparación del ambiente (no son casos del catálogo)
